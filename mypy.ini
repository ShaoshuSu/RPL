[mypy]
python_version = 3.10
files = rpl_training, rpl_sim2sim
exclude = (?x)(^thirdparty/)
plugins = pydantic.mypy
warn_redundant_casts = True

[mypy-torch.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-holosoma.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-isaacgym.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-trimesh.*]
ignore_missing_imports = True

[mypy-holosoma_inference.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-onnxruntime.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-mujoco.*]
ignore_missing_imports = True
