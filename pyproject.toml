[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpl-training"
version = "0.1.0"
description = "RPL / FALCON-Terrains for G1 29-DoF: per-terrain RL experts and multi-depth DAgger distillation on Holosoma."
requires-python = ">=3.8"
# Pinned through the thirdparty/holosoma submodule (branch zyuanhan/rpl-release-port).
dependencies = ["holosoma"]
authors = [{ name = "Amazon FAR Team" }]

[project.optional-dependencies]
test = ["pytest"]

# Registers the presets with Holosoma's config registries, so they also show up in
# ``python -m holosoma.train_agent`` once this package is installed.
[project.entry-points."holosoma.config.experiment"]
g1_29dof_falcon_hm_force_falcon = "rpl_training.config_values.experiment:g1_29dof_falcon_hm_force_falcon"
g1_29dof_falcon_hm_force_falcon_stones = "rpl_training.config_values.experiment:g1_29dof_falcon_hm_force_falcon_stones"
g1_29dof_falcon_hm_force_falcon_stairs = "rpl_training.config_values.experiment:g1_29dof_falcon_hm_force_falcon_stairs"
g1_29dof_falcon_hm_force_falcon_slopes = "rpl_training.config_values.experiment:g1_29dof_falcon_hm_force_falcon_slopes"
g1_29dof_falcon_hm_force_falcon_distill = "rpl_training.config_values.experiment:g1_29dof_falcon_hm_force_falcon_distill"

[project.entry-points."holosoma.config.camera_manager"]
warp_dual_depth_cameras_falcon = "rpl_training.config_values.camera:warp_dual_depth_cameras_falcon"

[project.entry-points."holosoma.config.terrain"]
terrain_locomotion_multi = "rpl_training.config_values.terrain:terrain_locomotion_multi"
terrain_locomotion_multi_falcon = "rpl_training.config_values.terrain:terrain_locomotion_multi_falcon"
terrain_locomotion_multi_falcon_expert = "rpl_training.config_values.terrain:terrain_locomotion_multi_falcon_expert"
terrain_falcon_sim2sim = "rpl_sim2sim.sim_presets:terrain_falcon_sim2sim"

[project.entry-points."holosoma.config.simulator"]
isaacgym_falcon = "rpl_training.config_values.simulator:isaacgym_falcon"

# No ``holosoma.config.robot`` entry points: holosoma and holosoma_inference share that group name,
# so the inference env would try to import these holosoma-only robot presets. The launchers
# register them instead.

# Sim2sim: FALCON-Terrains MuJoCo environment (needs holosoma) and the depth student
# (needs holosoma_inference only).
[project.entry-points."holosoma.policies.by_type"]
rpl_depth = "rpl_sim2sim.policy:RplDepthPolicy"

[project.entry-points."holosoma.config.inference"]
g1-29dof-rpl-depth = "rpl_sim2sim.inference_presets:g1_29dof_rpl_depth"

[project.entry-points."holosoma.config.run_sim"]
mujoco_falcon_sim2sim = "rpl_sim2sim.sim_presets:mujoco_falcon_sim2sim"

[project.entry-points."holosoma.config.sensor"]
falcon-front-depth = "rpl_sim2sim.sim_presets:falcon_front_depth"
falcon-back-depth = "rpl_sim2sim.sim_presets:falcon_back_depth"

[project.entry-points."holosoma.config.plugin"]
depth-shm-falcon = "rpl_sim2sim.sim_presets:depth_shm_falcon"

[tool.setuptools.packages.find]
include = ["rpl_training*", "rpl_sim2sim*"]

[tool.setuptools.package-data]
rpl_training = ["training_runs/*.sh", "data/**/*"]
rpl_sim2sim = ["models/*.onnx"]

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["thirdparty"]
lint.select = ["E", "F", "W", "I", "UP", "B"]
lint.ignore = ["E501", "B905", "UP006", "UP007", "UP035", "B006", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rpl_training", "rpl_sim2sim"]
known-third-party = ["holosoma", "holosoma_inference"]

[tool.pytest.ini_options]
testpaths = ["rpl_training/tests", "rpl_sim2sim/tests"]
