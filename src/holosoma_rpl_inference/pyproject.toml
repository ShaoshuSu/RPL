[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holosoma-rpl-inference"
version = "0.1.0"
description = "Inference extension for holosoma with depth policy and loco-manip support"
requires-python = ">=3.10"
dependencies = [
    "holosoma-inference",
    "termcolor",
]

[project.entry-points."holosoma.config.inference"]
g1-29dof-loco-manip-stand-height-waist = "holosoma_rpl_inference.config.inference:g1_29dof_loco_manip_stand_height_waist"

[tool.setuptools.packages.find]
where = ["."]
